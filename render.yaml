
services:
  - type: web
    name: sevenofspades-carousel
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --config gunicorn.conf.py app:app
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BASE_URL
        sync: false
        
